<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Secure Password Vault</title><style>body{margin:0;font-family:Verdana,Arial,sans-serif;background:#0f1720;color:#e8eef5;}header{background:#16222e;padding:14px 24px;border-bottom:3px solid #2f81f7;}header h1{margin:0;font-size:20px;color:#2f81f7;}nav{padding:10px 24px;background:#101a24;}nav a{color:#9fc6ff;margin-right:18px;text-decoration:none;font-size:14px;}nav a:hover{color:#fff;}main{max-width:760px;margin:30px auto;padding:0 20px;}.card{background:#16222e;border:1px solid #233545;border-radius:10px;padding:22px;margin-bottom:18px;}.card h2{margin-top:0;color:#2f81f7;font-size:18px;}li{margin:6px 0;}input[type=text]{width:70%;padding:10px;border-radius:6px;border:1px solid #233545;background:#0f1720;color:#e8eef5;}button{padding:10px 18px;border:none;border-radius:6px;background:#2f81f7;color:#fff;font-weight:bold;cursor:pointer;}.weak{color:#ff6b6b;font-weight:bold;}.ok{color:#f7c948;font-weight:bold;}.strong{color:#3ddc97;font-weight:bold;}.vstrong{color:#2f81f7;font-weight:bold;}.foot{text-align:center;color:#5b7186;font-size:12px;margin:30px 0;}</style></head><body><header><h1>Secure Password Vault</h1></header><nav><a href='index.html'>Home</a><a href='features.html'>Features</a><a href='check.html'>Strength Checker</a><a href='about.html'>About</a></nav><main><div class='card'><h2>Password Strength Checker</h2><input type='text' id='p' placeholder='type a password to test' maxlength='64'><button onclick='check()'>Check</button><p style='color:#5b7186;font-size:12px'>Same scoring rules as the C program, runs in your browser. Nothing is stored.</p><div id='out'></div></div><script>function check(){var p=document.getElementById('p').value;var out=document.getElementById('out');if(!p){out.innerHTML='';return;}var bad=['password','123456','12345678','qwerty','111111','abc123','letmein','iloveyou','admin','welcome'];var low=0,up=0,dig=0,sym=0;for(var i=0;i<p.length;i++){var c=p[i];if(c>='a'&&c<='z')low=1;else if(c>='A'&&c<='Z')up=1;else if(c>='0'&&c<='9')dig=1;else sym=1;}var s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(p.length>=16)s++;s+=low+up+dig+sym;if(bad.indexOf(p.toLowerCase())>=0)s=0;var label,cls;if(s<=2){label='Weak';cls='weak';}else if(s<=4){label='Okay';cls='ok';}else if(s<=5){label='Strong';cls='strong';}else{label='Very strong';cls='vstrong';}out.innerHTML="<div class='card'><h2>Result</h2><p>Length: "+p.length+" characters</p>"+"<p>Score: "+s+" / 7</p><p>Verdict: <span class='"+cls+"'>"+label+"</span></p>"+"<p>Lowercase: "+(low?'yes':'no')+" &middot; Uppercase: "+(up?'yes':'no')+" &middot; Digits: "+(dig?'yes':'no')+" &middot; Symbols: "+(sym?'yes':'no')+"</p>"+((bad.indexOf(p.toLowerCase())>=0)?"<p class='weak'>That is a very common password. Never use it.</p>":"")+"</div>";}</script></main><div class='foot'>Generated by the vault's C program &middot; no frameworks</div></body></html>
